<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarrot Card Reading</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="header-container">
        <div class="decoline1"></div>
        <span class="choose3cards">Enter your question - Choose three cards - Confirm</span>
        <div class="steps-wrapper">
            <div class="step-item">
                <div class="step-num">1</div>
                <div class="step-text">
                    <div class="step-label">Past</div>
                    <span class="step-sub">What has shaped you?</span>
                </div>
            </div>
            <div class="step-item">
                <div class="step-num">2</div>
                <div class="step-text">
                    <div class="step-label">Present</div>
                    <span class="step-sub">What is happening now?</span>
                </div>
            </div>
            <div class="step-item">
                <div class="step-num">3</div>
                <div class="step-text">
                    <div class="step-label">Future</div>
                    <span class="step-sub">What lies ahead?</span>
                </div>
            </div>
        </div>
        <div class="decoline2"></div>
    </div>

    <div class="content-container">
        <form class="questionpanel">
            <input type="text" placeholder="Ask the universe">
            <button type="submit" id="submitbutton">Confirm</button>
            <div class="spinner-grow" role="status" id="loadingSpinner" style="display: none;">
                <span class="sr-only"></span>
            </div>
        </form>
        <div class="card-grid" id="cardGrid"></div>
    </div>

    <script src="AI.js"></script>
    <script src="script.js"></script>
</body>
</html>
